name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: continuous-release/.github/.github/workflows/auto-release.yml@main
    with:
      system: nx
      setup-command: pnpm install --frozen-lockfile
      test-command: pnpm nx run-many -t lint,unit-test,integration-test
      build-command: |
        set -euo pipefail
        pnpm nx release version "$VERSION" --stage-changes=false
        pnpm nx run-many -t build
        mkdir -p dist
        pnpm --filter './packages/typescript-*' exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist"
      publish-command: pnpm nx release publish --registry=https://npm.pkg.github.com
      artifact-glob: dist/*.tgz
